<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Feud - Crew Love Edition</title>
  <style>
    :root {
      --bg-color: #0d1b2a;
      --board-bg: #1b263b;
      --accent-gold: #FED141; /* CRXO Gold */
      --text-light: #e0e1dd;
      --strike-red: #d90429;
    }

    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* HOST CONTROLS */
    .host-panel {
      width: 100%;
      background: #000;
      padding: 15px;
      display: flex;
      justify-content: center;
      gap: 20px;
      align-items: center;
      position: relative;
      z-index: 100;
    }

    .host-panel input {
      padding: 10px;
      font-size: 16px;
      width: 300px;
      border: 2px solid var(--accent-gold);
      border-radius: 4px;
      background: #222;
      color: #fff;
    }

    .host-panel button {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background: var(--accent-gold);
      color: #000;
      transition: background 0.2s;
    }

    .host-panel button:hover {
      background: #fff;
    }

    .host-panel button.strike-btn {
      background: var(--strike-red);
      color: white;
    }

    /* DROPDOWN FOR SEARCH */
    .search-container {
      position: relative;
    }
    .dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      background: #333;
      border: 1px solid var(--accent-gold);
      border-top: none;
      max-height: 200px;
      overflow-y: auto;
      display: none;
    }
    .dropdown.active { display: block; }
    .dropdown-item {
      padding: 10px;
      cursor: pointer;
      border-bottom: 1px solid #444;
    }
    .dropdown-item:hover { background: #444; }

    /* GAME BOARD */
    .game-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1000px;
      padding: 20px;
    }

    .question-display {
      font-size: 28px;
      text-align: center;
      margin-bottom: 30px;
      padding: 20px;
      background: var(--board-bg);
      border: 4px solid var(--accent-gold);
      border-radius: 12px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      width: 90%;
    }

    .board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      width: 100%;
    }

    /* 3D FLIP TILES */
    .tile {
      background-color: transparent;
      height: 70px;
      perspective: 1000px;
      cursor: pointer;
    }

    .tile-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    .tile.flipped .tile-inner {
      transform: rotateX(180deg);
    }

    .tile-front, .tile-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      border: 3px solid #415a77;
      border-radius: 8px;
      box-sizing: border-box;
    }

    .tile-front {
      background: linear-gradient(to bottom, #1b263b, #0d1b2a);
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      color: #778da9;
    }

    .tile-back {
      background: linear-gradient(to bottom, #001233, #001845);
      transform: rotateX(180deg);
      border-color: var(--accent-gold);
      padding: 0 15px;
    }

    .answer-text {
      flex: 1;
      text-align: left;
      font-size: 22px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .answer-points {
      font-size: 28px;
      font-weight: bold;
      color: var(--accent-gold);
      border-left: 2px solid var(--accent-gold);
      padding-left: 15px;
      min-width: 50px;
    }

    /* STRIKE OVERLAY */
    .strike-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .strike-overlay.show { opacity: 1; pointer-events: all; }
    .strike-mark {
      font-size: 350px;
      color: var(--strike-red);
      font-weight: bold;
      text-shadow: 0 0 30px #000;
      transform: scale(0.5);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .strike-overlay.show .strike-mark { transform: scale(1); }

  </style>

    let currentIndex = 0;

    // Initialize the board with the first question
    function loadQuestion(index) {
      const qData = questionBank[index];
      document.getElementById('questionText').innerText = qData.question;
      
      const board = document.getElementById('board');
      board.innerHTML = ''; // Clear old tiles

      // Sort answers by points descending just in case they aren't
      const sortedAnswers = [...qData.answers].sort((a, b) => b.points - a.points);

      sortedAnswers.forEach((ans, i) => {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.id = `tile-${i}`;
        // Manual override click to reveal (optional backup for host)
        tile.onclick = () => revealTile(i);

        tile.innerHTML = `
          <div class="tile-inner">
            <div class="tile-front">${i + 1}</div>
            <div class="tile-back">
              <span class="answer-text">${ans.text}</span>
              <span class="answer-points">${ans.points}</span>
            </div>
          </div>
        `;
        board.appendChild(tile);
      });

      // Clear search and dropdown
      document.getElementById('searchInput').value = '';
      document.getElementById('dropdown').classList.remove('active');
    }

    // Dynamic Host Search
    function handleSearch() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const dropdown = document.getElementById('dropdown');
      dropdown.innerHTML = '';

      if (query.length < 2) {
        dropdown.classList.remove('active');
        return;
      }

      const qData = questionBank[currentIndex];
      // Find matches where the text contains the query
      const matches = qData.answers.map((ans, idx) => ({ ans, idx }))
                                   .filter(item => item.ans.text.toLowerCase().includes(query));

      if (matches.length > 0) {
        dropdown.classList.add('active');
        matches.forEach(match => {
          const item = document.createElement('div');
          item.className = 'dropdown-item';
          item.innerText = `${match.ans.text} (${match.ans.points} pts) - Slot ${match.idx + 1}`;
          item.onclick = () => {
            revealTile(match.idx);
            document.getElementById('searchInput').value = '';
            dropdown.classList.remove('active');
          };
          dropdown.appendChild(item);
        });
      } else {
        dropdown.classList.remove('active');
      }
    }

    // Flip the specific tile
    function revealTile(index) {
      const tile = document.getElementById(`tile-${index}`);
      if (tile && !tile.classList.contains('flipped')) {
        tile.classList.add('flipped');
        // You could hook up sound effects here later
      }
    }

    // Strike Animation

      }, 1500);
    }

    // Navigation Controls

      if (currentIndex > 0) {
        currentIndex--;
        loadQuestion(currentIndex);
      }
    }
