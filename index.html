<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Feud - Solo & Host Edition</title>
  <style>
    :root {
      --bg-color: #0d1b2a;
      --board-bg: #1b263b;
      --accent-gold: #FED141;
      --text-light: #e0e1dd;
      --strike-red: #d90429;
      --emerald: #00A74A;
    }

    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* SCORE, TIMER, AUDIO & STRIKE HUD */
    .hud {
      width: 100%;
      background: #000;
      padding: 12px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      box-sizing: border-box;
      border-bottom: 2px solid var(--accent-gold);
      position: relative;
      z-index: 1500;
    }
    
    .hud-section {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .score-display {
      font-size: 22px;
      font-weight: bold;
      color: var(--accent-gold);
    }

    .high-score-display {
      font-size: 16px;
      font-weight: bold;
      color: #4caf50;
      background: #141414;
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid #2e4d30;
    }

    .mode-badge {
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 5px 10px;
      border-radius: 6px;
      background: #1b263b;
      color: var(--accent-gold);
      border: 1px solid var(--accent-gold);
    }

    .round-display {
      font-size: 16px;
      color: #aaa;
      font-weight: bold;
    }

    .timer-display {
      font-size: 28px;
      font-weight: bold;
      color: #fff;
      background: #222;
      padding: 5px 18px;
      border-radius: 6px;
      border: 2px solid #555;
      min-width: 50px;
      text-align: center;
      transition: all 0.3s;
    }

    .timer-display.low {
      color: var(--strike-red);
      border-color: var(--strike-red);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(217, 4, 41, 0.7); }
      50% { transform: scale(1.05); box-shadow: 0 0 10px 5px rgba(217, 4, 41, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(217, 4, 41, 0); }
    }

    /* AUDIO CONTROLS */
    .audio-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1a1a1a;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #333;
    }

    .sound-toggle-btn {
      background: transparent;
      border: none;
      color: var(--accent-gold);
      font-size: 20px;
      cursor: pointer;
      padding: 2px 5px;
      line-height: 1;
      transition: transform 0.15s;
    }

    .sound-toggle-btn:hover { transform: scale(1.15); }
    .sound-toggle-btn.muted { color: #666; }

    .volume-slider {
      width: 85px;
      cursor: pointer;
      accent-color: var(--accent-gold);
    }

    .strike-tracker {
      display: flex;
      gap: 10px;
      font-size: 30px;
      color: #333;
      font-weight: bold;
    }

    .strike-tracker span.active {
      color: var(--strike-red);
      text-shadow: 0 0 10px var(--strike-red);
    }

    /* HOST PLAYER SCORECARDS */
    .player-scorecards {
      display: none;
      width: 100%;
      max-width: 1000px;
      padding: 15px 20px 0 20px;
      box-sizing: border-box;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .player-scorecards.show {
      display: flex;
    }

    .scorecard {
      background: var(--board-bg);
      border: 2px solid #415a77;
      border-radius: 10px;
      padding: 10px 20px;
      min-width: 130px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }

    .scorecard:hover {
      border-color: #aaa;
      transform: translateY(-2px);
    }

    .scorecard.active {
      border-color: var(--accent-gold);
      background: #001845;
      box-shadow: 0 0 18px rgba(254, 209, 65, 0.35);
      transform: translateY(-2px);
    }

    .scorecard-name {
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #bbb;
      margin-bottom: 4px;
    }

    .scorecard.active .scorecard-name {
      color: var(--accent-gold);
    }

    .scorecard-points {
      font-size: 28px;
      font-weight: bold;
      color: #fff;
    }

    /* GAME BOARD */
    .game-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1000px;
      padding: 20px;
      box-sizing: border-box;
    }

    .question-display {
      font-size: 25px;
      text-align: center;
      margin-bottom: 22px;
      padding: 18px 22px;
      background: var(--board-bg);
      border: 4px solid var(--accent-gold);
      border-radius: 12px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      width: 92%;
    }

    .board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      width: 100%;
      margin-bottom: 25px;
    }

    /* TILES */
    .tile {
      background-color: transparent;
      height: 70px;
      perspective: 1000px;
    }

    .tile.host-clickable {
      cursor: pointer;
    }

    .tile-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    .tile.flipped .tile-inner { transform: rotateX(180deg); }
    
    .tile-front, .tile-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      border: 3px solid #415a77;
      border-radius: 8px;
      box-sizing: border-box;
    }

    .tile-front {
      background: linear-gradient(to bottom, #1b263b, #0d1b2a);
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      color: #778da9;
    }

    .tile.host-clickable:hover .tile-front {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    .tile-back {
      background: linear-gradient(to bottom, #001233, #001845);
      transform: rotateX(180deg);
      border-color: var(--accent-gold);
      padding: 0 15px;
    }

    .tile.missed .tile-back {
      border-color: var(--strike-red);
      color: #999;
    }

    .answer-text {
      flex: 1;
      text-align: left;
      font-size: 19px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .answer-points {
      font-size: 26px;
      font-weight: bold;
      color: var(--accent-gold);
      border-left: 2px solid var(--accent-gold);
      padding-left: 15px;
      min-width: 40px;
    }

    /* SOLO PLAYER INPUT CONSOLE */
    .player-console {
      display: flex;
      gap: 15px;
      width: 100%;
      max-width: 600px;
    }

    .player-console input {
      flex: 1;
      padding: 15px;
      font-size: 18px;
      border: 2px solid var(--accent-gold);
      border-radius: 8px;
      background: #222;
      color: #fff;
      outline: none;
    }

    .player-console input:focus {
      box-shadow: 0 0 10px rgba(254, 209, 65, 0.5);
    }

    .player-console button {
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: var(--accent-gold);
      color: #000;
      transition: background 0.2s;
    }

    .player-console button:hover { background: #fff; }

    /* HOST COMMAND BAR */
    .host-console {
      display: none;
      width: 100%;
      background: #09131f;
      border: 2px solid #415a77;
      border-radius: 12px;
      padding: 15px 20px;
      box-sizing: border-box;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .host-console.show {
      display: flex;
    }

    .host-search-wrap {
      position: relative;
      flex: 1;
      min-width: 240px;
    }

    .host-search-wrap input {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border: 2px solid var(--accent-gold);
      border-radius: 8px;
      background: #1a1a1a;
      color: #fff;
      box-sizing: border-box;
      outline: none;
    }

    .host-dropdown {
      position: absolute;
      bottom: 100%;
      left: 0;
      width: 100%;
      background: #1b263b;
      border: 2px solid var(--accent-gold);
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      max-height: 210px;
      overflow-y: auto;
      display: none;
      z-index: 1600;
      box-sizing: border-box;
    }

    .host-dropdown.active { display: block; }

    .host-dropdown-item {
      padding: 11px 14px;
      cursor: pointer;
      border-bottom: 1px solid #334;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
    }

    .host-dropdown-item:hover {
      background: #2b3d5b;
      color: var(--accent-gold);
    }

    .host-btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .host-btn {
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.2s;
    }

    .host-btn:hover { transform: scale(1.03); }
    .host-btn.strike { background: var(--strike-red); color: #fff; }
    .host-btn.clear-x { background: #334; color: #ddd; border: 1px solid #556; }
    .host-btn.reveal { background: #415a77; color: #fff; }
    .host-btn.next { background: var(--emerald); color: #fff; }
    
    .next-btn {
      display: none;
      margin-top: 20px;
      padding: 15px 40px;
      font-size: 20px;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.15s, background 0.2s;
    }

    .next-btn:hover {
      background: #45a049;
      transform: scale(1.03);
    }

    .next-btn.show { display: block; }

    /* OVERLAYS (START, STRIKE, GAME OVER) */
    .start-screen, .game-over-screen {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(13, 27, 42, 0.97);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1200;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
      transition: opacity 0.4s;
    }

    .start-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .start-title {
      font-size: 52px;
      color: var(--accent-gold);
      margin: 0 0 8px 0;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 4px 20px rgba(254, 209, 65, 0.3);
    }

    .start-subtitle {
      font-size: 17px;
      color: #bbb;
      margin: 0 0 22px 0;
      max-width: 540px;
      line-height: 1.4;
    }

    /* SETUP PANEL ON START SCREEN */
    .setup-panel {
      background: #142133;
      border: 1px solid #415a77;
      border-radius: 14px;
      padding: 20px 26px;
      width: 100%;
      max-width: 540px;
      box-sizing: border-box;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .setup-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .setup-label {
      font-size: 15px;
      color: #ccc;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .opt-btn {
      padding: 8px 15px;
      font-size: 14px;
      font-weight: bold;
      background: #0d1b2a;
      color: #aaa;
      border: 2px solid #415a77;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .opt-btn:hover {
      border-color: var(--accent-gold);
      color: #fff;
    }

    .opt-btn.selected {
      background: var(--accent-gold);
      color: #000;
      border-color: var(--accent-gold);
    }

    /* HOST ROSTER SETUP */
    .roster-box {
      display: none;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid #2b3d5b;
      padding-top: 14px;
      text-align: left;
    }

    .roster-box.show {
      display: flex;
    }

    .roster-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .add-player-btn {
      background: #23354d;
      color: var(--accent-gold);
      border: 1px solid var(--accent-gold);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .add-player-btn:hover {
      background: var(--accent-gold);
      color: #000;
    }

    .roster-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .roster-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .roster-item input {
      flex: 1;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #415a77;
      background: #0d1b2a;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .roster-item input:focus {
      border-color: var(--accent-gold);
    }

    .remove-player-btn {
      background: transparent;
      border: 1px solid #633;
      color: #f66;
      border-radius: 6px;
      padding: 6px 9px;
      cursor: pointer;
      font-weight: bold;
    }

    .remove-player-btn:hover {
      background: var(--strike-red);
      color: #fff;
    }

    .begin-btn, .play-again-btn {
      padding: 16px 55px;
      font-size: 24px;
      background: var(--accent-gold);
      color: #000;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      letter-spacing: 2px;
      box-shadow: 0 8px 25px rgba(254, 209, 65, 0.3);
      transition: transform 0.2s, background 0.2s;
    }

    .begin-btn:hover, .play-again-btn:hover {
      background: #fff;
      transform: scale(1.05);
    }

    /* STRIKE OVERLAY */
    .strike-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1800;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .strike-overlay.show { opacity: 1; pointer-events: all; }

    .strike-mark {
      font-size: 280px;
      color: var(--strike-red);
      font-weight: bold;
      text-shadow: 0 0 40px #000;
      transform: scale(0.5);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .strike-overlay.show .strike-mark { transform: scale(1); }

    /* GAME OVER SCREEN */
    .game-over-screen {
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
    }

    .game-over-screen.show { opacity: 1; pointer-events: all; }

    .game-over-title {
      font-size: 56px;
      color: var(--accent-gold);
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .new-high-badge {
      display: none;
      font-size: 22px;
      font-weight: bold;
      color: #000;
      background: var(--accent-gold);
      padding: 6px 20px;
      border-radius: 20px;
      margin-bottom: 20px;
      letter-spacing: 1px;
      box-shadow: 0 0 20px rgba(254, 209, 65, 0.5);
    }

    .new-high-badge.show { display: inline-block; }

    .game-over-score {
      font-size: 42px;
      color: #fff;
      margin-bottom: 12px;
    }

    .game-over-high-score {
      font-size: 22px;
      color: #4caf50;
      font-weight: bold;
      margin-bottom: 35px;
    }

    .leaderboard-box {
      display: none;
      width: 100%;
      max-width: 460px;
      margin-bottom: 35px;
      background: #142133;
      border: 2px solid var(--accent-gold);
      border-radius: 12px;
      padding: 15px 20px;
      box-sizing: border-box;
    }

    .leaderboard-box.show { display: block; }

    .leaderboard-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 10px;
      border-bottom: 1px solid #2b3d5b;
      font-size: 22px;
      font-weight: bold;
    }

    .leaderboard-row:last-child { border-bottom: none; }
    .leaderboard-row.winner { color: var(--accent-gold); font-size: 26px; }

    .game-over-actions {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .menu-btn {
      padding: 16px 35px;
      font-size: 20px;
      background: #23354d;
      color: #fff;
      border: 2px solid #415a77;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .menu-btn:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }
  </style>
</head>
<body>

  <!-- Heads Up Display -->
  <div class="hud">
    <div class="hud-section">
      <div class="mode-badge" id="modeBadge">SOLO</div>
      <div class="score-display" id="soloScoreWrap">SCORE: <span id="scoreText">0</span></div>
      <div class="high-score-display" id="soloHighWrap">BEST: <span id="highScoreText">0</span></div>
      <div class="round-display" id="roundText">ROUND 1 / 50</div>
    </div>

    <div class="timer-display" id="timerDisplay">60</div>

    <div class="hud-section">
      <div class="audio-controls" title="Sound Controls">
        <button id="soundToggleBtn" class="sound-toggle-btn" onclick="toggleSound()" aria-label="Toggle Sound">🔊</button>
        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.05" value="0.5" oninput="updateVolume(this.value)">
      </div>

      <div class="strike-tracker" id="strikeTracker">
        <span id="strike-1">X</span>
        <span id="strike-2">X</span>
        <span id="strike-3">X</span>
      </div>
    </div>
  </div>

  <!-- Start Screen Overlay -->
  <div class="start-screen" id="startScreen">
    <h1 class="start-title">Family Feud</h1>
    <p class="start-subtitle">
      50 Shuffled Questions &bull; Solo Arcade or Live Host Mode
    </p>

    <div class="setup-panel">
      <!-- Mode Toggle -->
      <div class="setup-row">
        <span class="setup-label">Game Mode:</span>
        <div class="btn-group">
          <button class="opt-btn selected" id="modeSoloBtn" onclick="setGameMode('solo', this)">Solo Arcade</button>
          <button class="opt-btn" id="modeHostBtn" onclick="setGameMode('host', this)">Host Mode</button>
        </div>
      </div>

      <!-- Round Length -->
      <div class="setup-row">
        <span class="setup-label">Round Length:</span>
        <div class="btn-group">
          <button class="opt-btn" onclick="setRoundLength(5, this)">5</button>
          <button class="opt-btn selected" onclick="setRoundLength(10, this)">10</button>
          <button class="opt-btn" onclick="setRoundLength(25, this)">25</button>
          <button class="opt-btn" onclick="setRoundLength(50, this)">All (50)</button>
        </div>
      </div>

      <!-- Round Timer -->
      <div class="setup-row">
        <span class="setup-label">Round Timer:</span>
        <div class="btn-group" id="timerBtnGroup">
          <button class="opt-btn" onclick="setRoundDuration(45, this)">45s</button>
          <button class="opt-btn selected" onclick="setRoundDuration(60, this)">60s</button>
          <button class="opt-btn" onclick="setRoundDuration(90, this)">90s</button>
          <button class="opt-btn" onclick="setRoundDuration(0, this)">Off</button>
        </div>
      </div>

      <!-- Host Player Roster -->
      <div class="roster-box" id="rosterBox">
        <div class="roster-header">
          <span class="setup-label">Players / Teams (Direct Scoring):</span>
          <button class="add-player-btn" onclick="addPlayerInput()">+ Add Player</button>
        </div>
        <div class="roster-list" id="rosterList"></div>
      </div>
    </div>

    <button class="begin-btn" onclick="startGame()">BEGIN</button>
  </div>

  <!-- Host Mode Player Scorecards -->
  <div class="player-scorecards" id="playerScorecards"></div>

  <!-- Main Game Board -->
  <div class="game-container">
    <div class="question-display" id="questionText">Ready to Play...</div>
    
    <div class="board" id="board"></div>

    <!-- Solo Player Input Console -->
    <div class="player-console" id="playerConsole">
      <input type="text" id="guessInput" placeholder="Type your guess..." onkeypress="handleEnter(event)" autocomplete="off">
      <button onclick="submitGuess()">GUESS</button>
    </div>

    <!-- Host Command Bar -->
    <div class="host-console" id="hostConsole">
      <div class="host-search-wrap">
        <div id="hostDropdown" class="host-dropdown"></div>
        <input type="text" id="hostSearchInput" placeholder="Host search: type answer or synonym..." oninput="handleHostSearch()" autocomplete="off">

          {"text": "Avoiding a clingy date/ex", "points": 35, "synonyms": ["ex", "date", "annoying person", "ignoring someone", "dont want to talk", "clingy", "ghosting"]},
          {"text": "Ignoring your boss/work", "points": 25, "synonyms": ["boss", "work", "coworker", "weekend", "day off", "shift"]},
          {"text": "Late/Flaking on plans", "points": 18, "synonyms": ["late", "flaking", "bail", "cancel", "staying home", "lazy", "asleep"]},
          {"text": "Didn't want to talk to parents", "points": 12, "synonyms": ["mom", "dad", "parents", "family", "partner", "spouse"]},
          {"text": "Out somewhere you shouldn't be", "points": 10, "synonyms": ["cheating", "sneaking out", "bar", "partying", "hiding", "location", "trouble"]}
        ]
      }
    ];

    const HIGH_SCORE_KEY = 'familyFeudSoloHighScore';

    // Game Configuration & State
    let gameMode = 'solo'; // 'solo' | 'host'
    let selectedRoundLength = 10;
    let selectedRoundTime = 60; // 0 = Untimed
    let activeQuestions = [];
    let currentIndex = 0;

    // Solo State
    let totalScore = 0;
    let highScore = parseInt(localStorage.getItem(HIGH_SCORE_KEY), 10) || 0;
    let beatHighScoreThisRun = false;

    // Host State
    let rosterNames = ['Player 1', 'Player 2'];
    let players = [];
    let activePlayerIndex = 0;

    // Round State
    let currentStrikes = 0;
    let revealedTiles = 0;
    let currentAnswers = [];
    let roundActive = false;
    let isAnimatingStrike = false;
    let roundTimer;
    let timeLeft = selectedRoundTime;

    // Audio State
    let audioCtx = null;
    let isMuted = false;
    let masterVolume = 0.5;

    // --- SETUP SCREEN CONTROLS ---
    function setGameMode(mode, btnEl) {
      gameMode = mode;
      document.getElementById('modeSoloBtn').classList.remove('selected');
      document.getElementById('modeHostBtn').classList.remove('selected');
      btnEl.classList.add('selected');

      const rosterBox = document.getElementById('rosterBox');
      if (mode === 'host') {
        rosterBox.classList.add('show');
        renderRosterInputs();
      } else {
        rosterBox.classList.remove('show');
      }
    }

    function setRoundLength(count, btnEl) {
      selectedRoundLength = count;
      btnEl.parentElement.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
      btnEl.classList.add('selected');
      document.getElementById('roundText').innerText = `ROUND 1 / ${count}`;
    }

    function setRoundDuration(seconds, btnEl) {
      selectedRoundTime = seconds;
      timeLeft = seconds;
      document.getElementById('timerDisplay').innerText = seconds === 0 ? 'OFF' : seconds;
      btnEl.parentElement.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
      btnEl.classList.add('selected');
    }

    function renderRosterInputs() {
      const list = document.getElementById('rosterList');
      list.innerHTML = '';
      rosterNames.forEach((name, idx) => {
        const div = document.createElement('div');
        div.className = 'roster-item';
        div.innerHTML = `
          <input type="text" value="${name}" placeholder="Player ${idx + 1}" oninput="updateRosterName(${idx}, this.value)">
          ${rosterNames.length > 2 ? `<button class="remove-player-btn" onclick="removePlayerInput(${idx})">&times;</button>` : ''}
        `;
        list.appendChild(div);
      });
    }

    function updateRosterName(idx, val) {
      rosterNames[idx] = val;
    }

    function addPlayerInput() {
      if (rosterNames.length >= 6) return;
      rosterNames.push(`Player ${rosterNames.length + 1}`);
      renderRosterInputs();
    }

    function removePlayerInput(idx) {
      if (rosterNames.length <= 2) return;
      rosterNames.splice(idx, 1);
      renderRosterInputs();
    }

    // --- SHUFFLE & HIGH SCORE ---
    function shuffleQuestions() {
      const shuffled = [...questionBank];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled.slice(0, Math.min(selectedRoundLength, shuffled.length));
    }

    function updateHighScore(score) {
      if (score > highScore) {
        highScore = score;
        beatHighScoreThisRun = true;
        localStorage.setItem(HIGH_SCORE_KEY, highScore);
        document.getElementById('highScoreText').innerText = highScore;
      }
    }

    // --- AUDIO ENGINE ---
    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleSound() {
      isMuted = !isMuted;
      const btn = document.getElementById('soundToggleBtn');
      if (isMuted) {
        btn.innerText = '🔇';
        btn.classList.add('muted');
      } else {
        btn.innerText = '🔊';
        btn.classList.remove('muted');
        initAudio();
      }
    }

    function updateVolume(val) {
      masterVolume = parseFloat(val);
      const btn = document.getElementById('soundToggleBtn');
      if (masterVolume === 0) {
        isMuted = true;
        btn.innerText = '🔇';
        btn.classList.add('muted');
      } else if (isMuted) {
        isMuted = false;
        btn.innerText = '🔊';
        btn.classList.remove('muted');
      }
    }

    function playCorrectSound() {
      if (isMuted || masterVolume <= 0) return;
      initAudio();
      const now = audioCtx.currentTime;
      const freqs = [1046.50, 1318.51, 2093.00];
      freqs.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = idx === 0 ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(freq, now);

        const vol = (idx === 0 ? 0.35 : 0.18) * masterVolume;
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(vol, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.7);
      });
    }

    function triggerStudioBuzzer(startTime, duration, baseFreq = 73.42) {
      const envGain = audioCtx.createGain();
      envGain.gain.setValueAtTime(0.001, startTime);
      envGain.gain.linearRampToValueAtTime(0.55 * masterVolume, startTime + 0.018);
      envGain.gain.setValueAtTime(0.52 * masterVolume, startTime + duration - 0.06);
      envGain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

      const rattleGain = audioCtx.createGain();
      rattleGain.gain.setValueAtTime(0.85, startTime);
      const lfo = audioCtx.createOscillator();
      const lfoDepth = audioCtx.createGain();
      lfo.type = 'sine';
      lfo.frequency.setValueAtTime(32, startTime);
      lfoDepth.gain.setValueAtTime(0.18, startTime);
      lfo.connect(lfoDepth);
      lfoDepth.connect(rattleGain.gain);

      const lowpass = audioCtx.createBiquadFilter();
      lowpass.type = 'lowpass';
      lowpass.frequency.setValueAtTime(950, startTime);
      lowpass.Q.setValueAtTime(1.2, startTime);

      const nasalPeak = audioCtx.createBiquadFilter();
      nasalPeak.type = 'peaking';
      nasalPeak.frequency.setValueAtTime(380, startTime);
      nasalPeak.Q.setValueAtTime(2.2, startTime);
      nasalPeak.gain.setValueAtTime(7, startTime);

      nasalPeak.connect(lowpass);
      lowpass.connect(rattleGain);
      rattleGain.connect(envGain);
      envGain.connect(audioCtx.destination);

      const partials = [
        { mult: 1.0,  type: 'sawtooth', gain: 0.45 },
        { mult: 2.0,  type: 'sawtooth', gain: 0.35 },
        { mult: 2.06, type: 'triangle', gain: 0.30 },
        { mult: 3.0,  type: 'sawtooth', gain: 0.22 },
        { mult: 4.12, type: 'triangle', gain: 0.15 }
      ];

      partials.forEach(p => {
        const osc = audioCtx.createOscillator();
        const pGain = audioCtx.createGain();
        osc.type = p.type;
        osc.frequency.setValueAtTime(baseFreq * p.mult, startTime);
        pGain.gain.setValueAtTime(p.gain, startTime);
        osc.connect(pGain);
        pGain.connect(nasalPeak);
        osc.start(startTime);
        osc.stop(startTime + duration + 0.02);
      });

      lfo.start(startTime);
      lfo.stop(startTime + duration + 0.02);
    }

    function playWrongSound() {
      if (isMuted || masterVolume <= 0) return;
      initAudio();
      triggerStudioBuzzer(audioCtx.currentTime, 0.58, 73.42);
    }

    function playTimeUpSound() {
      if (isMuted || masterVolume <= 0) return;
      initAudio();
      const now = audioCtx.currentTime;
      triggerStudioBuzzer(now, 0.25, 65.41);
      triggerStudioBuzzer(now + 0.30, 0.72, 65.41);
    }

    function playTickSound() {
      if (isMuted || masterVolume <= 0) return;
      initAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, now);

      gain.gain.setValueAtTime(0.12 * masterVolume, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.07);
    }

    // --- GAME LIFECYCLE ---
    function startGame() {
      initAudio();
      activeQuestions = shuffleQuestions();
      currentIndex = 0;

      // Configure HUD & UI for selected mode
      document.getElementById('modeBadge').innerText = gameMode === 'host' ? 'HOST MODE' : 'SOLO';

      if (gameMode === 'host') {
        players = rosterNames.map((name, i) => ({
          name: name.trim() || `Player ${i + 1}`,
          score: 0
        }));
        activePlayerIndex = 0;
        document.getElementById('soloScoreWrap').style.display = 'none';
        document.getElementById('soloHighWrap').style.display = 'none';
        document.getElementById('playerScorecards').classList.add('show');
        document.getElementById('playerConsole').style.display = 'none';
        document.getElementById('hostConsole').classList.add('show');
        renderScorecards();
      } else {
        totalScore = 0;
        beatHighScoreThisRun = false;
        document.getElementById('scoreText').innerText = '0';
        document.getElementById('soloScoreWrap').style.display = 'block';
        document.getElementById('soloHighWrap').style.display = 'block';
        document.getElementById('playerScorecards').classList.remove('show');
        document.getElementById('hostConsole').classList.remove('show');
      }

      document.getElementById('startScreen').classList.add('hidden');
      loadQuestion(currentIndex);
    }

    function renderScorecards() {
      const container = document.getElementById('playerScorecards');
      container.innerHTML = '';
      players.forEach((p, idx) => {
        const card = document.createElement('div');
        card.className = `scorecard ${idx === activePlayerIndex ? 'active' : ''}`;
        card.onclick = () => {
          activePlayerIndex = idx;
          renderScorecards();
        };
        card.innerHTML = `
          <div class="scorecard-name">${p.name}</div>
          <div class="scorecard-points">${p.score}</div>
        `;
        container.appendChild(card);
      });
    }

    function loadQuestion(index) {
      const qData = activeQuestions[index];
      document.getElementById('questionText').innerText = qData.question;
      document.getElementById('roundText').innerText = `ROUND ${index + 1} / ${activeQuestions.length}`;
      
      currentStrikes = 0;
      revealedTiles = 0;
      roundActive = true;
      isAnimatingStrike = false;
      updateStrikeUI();
      
      document.getElementById('nextBtn').classList.remove('show');

      if (gameMode === 'solo') {
        document.getElementById('playerConsole').style.display = 'flex';
        const input = document.getElementById('guessInput');
        input.value = '';
        input.focus();
      } else {
        const hostInput = document.getElementById('hostSearchInput');
        hostInput.value = '';
        document.getElementById('hostDropdown').classList.remove('active');
        hostInput.focus();
      }

      const board = document.getElementById('board');
      board.innerHTML = ''; 

      currentAnswers = [...qData.answers].sort((a, b) => b.points - a.points);
      
      currentAnswers.forEach((ans, i) => {
        ans.revealed = false;
        const tile = document.createElement('div');
        tile.className = `tile ${gameMode === 'host' ? 'host-clickable' : ''}`;
        tile.id = `tile-${i}`;

        if (gameMode === 'host') {
          tile.onclick = () => {
            if (!ans.revealed) {
              revealTile(i, ans.points, true);
              playCorrectSound();
            }
          };
        }

        tile.innerHTML = `
          <div class="tile-inner">
            <div class="tile-front">${i + 1}</div>
            <div class="tile-back">
              <span class="answer-text">${ans.text}</span>
              <span class="answer-points">${ans.points}</span>
            </div>
          </div>
        `;
        board.appendChild(tile);
      });

      startTimer();
    }

    // --- TIMER ---
    function startTimer() {
      clearInterval(roundTimer);
      const timerDisplay = document.getElementById('timerDisplay');

      if (selectedRoundTime === 0) {
        timerDisplay.innerText = 'OFF';
        timerDisplay.classList.remove('low');
        return;
      }

      timeLeft = selectedRoundTime;
      updateTimerUI();
      
      roundTimer = setInterval(() => {
        if (!roundActive) {
          clearInterval(roundTimer);
          return;
        }
        if (isAnimatingStrike) return;
        
        timeLeft--;
        updateTimerUI();

        if (timeLeft <= 5 && timeLeft > 0) {
          playTickSound();
        }
        
        if (timeLeft <= 0) {
          clearInterval(roundTimer);
          triggerTimeOut();
        }
      }, 1000);
    }

    function updateTimerUI() {
      const timerDisplay = document.getElementById('timerDisplay');
      timerDisplay.innerText = timeLeft;
      if (timeLeft <= 10 && timeLeft > 0) {
        timerDisplay.classList.add('low');
      } else {
        timerDisplay.classList.remove('low');
      }
    }

    function triggerTimeOut() {
      if (!roundActive) return;
      roundActive = false;
      playTimeUpSound();
      
      const overlay = document.getElementById('strikeOverlay');
      const strikeMark = document.getElementById('strikeMark');
      strikeMark.innerText = 'TIME!';
      strikeMark.style.fontSize = '180px';
      overlay.classList.add('show');
      
      setTimeout(() => {
        overlay.classList.remove('show');
        if (gameMode === 'solo') {
          endRound(false);
        }
      }, 1600);
    }

    // --- SOLO GUESSING ---
    function handleEnter(e) {
      if (e.key === 'Enter') submitGuess();
    }

    function submitGuess() {
      if (!roundActive || isAnimatingStrike || gameMode !== 'solo') return;

      const inputField = document.getElementById('guessInput');
      const guess = inputField.value.trim().toLowerCase();
      if (guess.length < 2) return;

      let matchFound = false;

      for (let i = 0; i < currentAnswers.length; i++) {
        let ans = currentAnswers[i];
        if (!ans.revealed) {
          let textMatch = ans.text.toLowerCase().includes(guess);
          let keywordMatch = false;
          const altWords = ans.synonyms || ans.keywords;
          if (altWords && Array.isArray(altWords)) {
            keywordMatch = altWords.some(keyword => {
              const kw = keyword.toLowerCase();
              return guess.includes(kw) || kw.includes(guess);
            });
          }

          if (textMatch || keywordMatch) {
            revealTile(i, ans.points, true);
            matchFound = true;
            break;
          }
        }
      }

      if (matchFound) {
        playCorrectSound();
        inputField.value = '';
        checkRoundWin();
      } else {
        triggerSoloStrike();
      }
    }

    // --- HOST SEARCH & CONTROLS ---
    function handleHostSearch() {
      const query = document.getElementById('hostSearchInput').value.trim().toLowerCase();
      const dropdown = document.getElementById('hostDropdown');
      dropdown.innerHTML = '';

      if (query.length < 1) {
        dropdown.classList.remove('active');
        return;
      }

      const matches = currentAnswers
        .map((ans, idx) => ({ ans, idx }))
        .filter(item => {
          if (item.ans.revealed) return false;
          const textMatch = item.ans.text.toLowerCase().includes(query);
          const altWords = item.ans.synonyms || item.ans.keywords || [];
          const synMatch = altWords.some(s => s.toLowerCase().includes(query) || query.includes(s.toLowerCase()));
          return textMatch || synMatch;
        });

      if (matches.length > 0) {
        dropdown.classList.add('active');
        matches.forEach(match => {
          const item = document.createElement('div');
          item.className = 'host-dropdown-item';
          item.innerHTML = `<span>#${match.idx + 1} ${match.ans.text}</span><strong>${match.ans.points} pts</strong>`;
          item.onclick = () => {
            revealTile(match.idx, match.ans.points, true);
            playCorrectSound();
            document.getElementById('hostSearchInput').value = '';
            dropdown.classList.remove('active');
            document.getElementById('hostSearchInput').focus();
          };
          dropdown.appendChild(item);
        });
      } else {
        dropdown.classList.remove('active');
      }
    }

    function triggerHostStrike() {
      if (isAnimatingStrike) return;
      isAnimatingStrike = true;
      currentStrikes = Math.min(currentStrikes + 1, 3);
      updateStrikeUI();
      playWrongSound();

      const overlay = document.getElementById('strikeOverlay');
      const strikeMark = document.getElementById('strikeMark');
      strikeMark.innerText = 'X'.repeat(currentStrikes);
      strikeMark.style.fontSize = '280px';
      overlay.classList.add('show');

      setTimeout(() => {
        overlay.classList.remove('show');
        isAnimatingStrike = false;
      }, 1200);
    }

    function clearHostStrikes() {
      currentStrikes = 0;
      updateStrikeUI();
    }

    function revealAllHost() {
      roundActive = false;
      clearInterval(roundTimer);
      let delayStep = 0;
      currentAnswers.forEach((ans, i) => {
        if (!ans.revealed) {
          const tile = document.getElementById(`tile-${i}`);
          tile.classList.add('missed');
          ans.revealed = true;
          setTimeout(() => { tile.classList.add('flipped'); }, delayStep * 250);
          delayStep++;
        }
      });
    }

    // --- SHARED TILE & STRIKE LOGIC ---
    function revealTile(index, points, awardPoints = true) {
      const tile = document.getElementById(`tile-${index}`);
      if (tile && !currentAnswers[index].revealed) {
        tile.classList.add('flipped');
        currentAnswers[index].revealed = true;
        revealedTiles++;
        
        if (awardPoints && points > 0) {
          if (gameMode === 'solo') {
            totalScore += points;
            document.getElementById('scoreText').innerText = totalScore;
            updateHighScore(totalScore);
          } else {
            players[activePlayerIndex].score += points;
            renderScorecards();
          }
        }
      }
    }

    function triggerSoloStrike() {
      isAnimatingStrike = true;
      currentStrikes++;
      updateStrikeUI();
      playWrongSound();

      const overlay = document.getElementById('strikeOverlay');
      const strikeMark = document.getElementById('strikeMark');
      strikeMark.innerText = 'X'.repeat(currentStrikes);
      strikeMark.style.fontSize = '280px';
      overlay.classList.add('show');
      
      setTimeout(() => {
        overlay.classList.remove('show');
        isAnimatingStrike = false;
        if (currentStrikes >= 3) {
          endRound(false);
        } else {
          document.getElementById('guessInput').value = '';
          document.getElementById('guessInput').focus();
        }
      }, 1300);
    }

    function updateStrikeUI() {
      for (let i = 1; i <= 3; i++) {
        const x = document.getElementById(`strike-${i}`);
        if (i <= currentStrikes) {
          x.classList.add('active');
        } else {
          x.classList.remove('active');
        }
      }
    }

    function checkRoundWin() {
      if (revealedTiles === currentAnswers.length) {
        endRound(true);
      }
    }

    function endRound(perfect) {
      roundActive = false;
      clearInterval(roundTimer);
      document.getElementById('playerConsole').style.display = 'none';
      document.getElementById('nextBtn').classList.add('show');

      if (!perfect) {
        let delayStep = 0;
        currentAnswers.forEach((ans, i) => {
          if (!ans.revealed) {
            const tile = document.getElementById(`tile-${i}`);
            tile.classList.add('missed');
            setTimeout(() => { tile.classList.add('flipped'); }, delayStep * 300);
            delayStep++;
          }
        });
      }
    }

    function nextQuestion() {
      clearInterval(roundTimer);
      if (currentIndex < activeQuestions.length - 1) {
        currentIndex++;
        loadQuestion(currentIndex);
      } else {
        showGameOver();
      }
    }

    function showGameOver() {
      clearInterval(roundTimer);
      const soloWrap = document.getElementById('soloResultsWrap');
      const hostBoard = document.getElementById('hostLeaderboard');

      if (gameMode === 'solo') {
        updateHighScore(totalScore);
        document.getElementById('gameOverTitle').innerText = 'Game Over';
        soloWrap.style.display = 'block';
        hostBoard.classList.remove('show');

        document.getElementById('finalScoreText').innerText = totalScore;
        document.getElementById('finalHighScoreText').innerText = highScore;

        const badge = document.getElementById('newHighBadge');
        if (beatHighScoreThisRun && totalScore > 0) {
          badge.classList.add('show');
        } else {
          badge.classList.remove('show');
        }
      } else {
        document.getElementById('gameOverTitle').innerText = 'Final Standings';
        soloWrap.style.display = 'none';
        hostBoard.classList.add('show');

        const sorted = [...players].sort((a, b) => b.score - a.score);
        hostBoard.innerHTML = sorted.map((p, idx) => `
          <div class="leaderboard-row ${idx === 0 ? 'winner' : ''}">
            <span>${idx === 0 ? '🏆 ' : `#${idx + 1} `}${p.name}</span>
            <span>${p.score} pts</span>
          </div>
        `).join('');
      }

      document.getElementById('gameOverScreen').classList.add('show');
    }

    function restartGame() {
      document.getElementById('gameOverScreen').classList.remove('show');
      startGame();
    }

    function returnToMenu() {
      clearInterval(roundTimer);
      document.getElementById('gameOverScreen').classList.remove('show');
      document.getElementById('startScreen').classList.remove('hidden');
    }

    // Initialize HUD on page load
    window.onload = () => {
      document.getElementById('roundText').innerText = `ROUND 1 / ${selectedRoundLength}`;
      document.getElementById('timerDisplay').innerText = selectedRoundTime;
      document.getElementById('highScoreText').innerText = highScore;
    };
  </script>

</body>
