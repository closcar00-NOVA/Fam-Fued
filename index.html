<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    :root {
      --bg-color: #0d1b2a;
      --board-bg: #1b263b;
      --accent-gold: #FED141;
      --text-light: #e0e1dd;
      --strike-red: #d90429;
    }

    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* SCORE, TIMER, AUDIO & STRIKE HUD */
    .hud {
      width: 100%;
      background: #000;
      padding: 12px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      box-sizing: border-box;
      border-bottom: 2px solid var(--accent-gold);
      position: relative;
      z-index: 1500;
    }
    
    .hud-section {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .score-display {
      font-size: 22px;
      font-weight: bold;
      color: var(--accent-gold);
    }

    .round-display {
      font-size: 16px;
      color: #aaa;
      font-weight: bold;
    }

    .timer-display {
      font-size: 28px;
      font-weight: bold;
      color: #fff;
      background: #222;
      padding: 5px 18px;
      border-radius: 6px;
      border: 2px solid #555;
      min-width: 50px;
      text-align: center;
      transition: all 0.3s;
    }

    .timer-display.low {
      color: var(--strike-red);
      border-color: var(--strike-red);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(217, 4, 41, 0.7); }
      50% { transform: scale(1.05); box-shadow: 0 0 10px 5px rgba(217, 4, 41, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(217, 4, 41, 0); }
    }

    /* AUDIO CONTROLS */
    .audio-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1a1a1a;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #333;
    }

    .sound-toggle-btn {
      background: transparent;
      border: none;
      color: var(--accent-gold);
      font-size: 20px;
      cursor: pointer;
      padding: 2px 5px;
      line-height: 1;
      transition: transform 0.15s;
    }

    .sound-toggle-btn:hover {
      transform: scale(1.15);
    }

    .sound-toggle-btn.muted {
      color: #666;
    }

    .volume-slider {
      width: 85px;
      cursor: pointer;
      accent-color: var(--accent-gold);
    }

    .strike-tracker {
      display: flex;
      gap: 10px;
      font-size: 30px;
      color: #333;
      font-weight: bold;
    }

    .strike-tracker span.active {
      color: var(--strike-red);
      text-shadow: 0 0 10px var(--strike-red);
    }

    /* GAME BOARD */
    .game-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1000px;
      padding: 20px;
      box-sizing: border-box;
    }

    .question-display {
      font-size: 26px;
      text-align: center;
      margin-bottom: 25px;
      padding: 20px;
      background: var(--board-bg);
      border: 4px solid var(--accent-gold);
      border-radius: 12px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      width: 90%;
    }

    .board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      width: 100%;
      margin-bottom: 30px;
    }

    /* TILES */
    .tile {
      background-color: transparent;
      height: 70px;
      perspective: 1000px;
    }

    .tile-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    .tile.flipped .tile-inner { transform: rotateX(180deg); }
    
    .tile-front, .tile-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      border: 3px solid #415a77;
      border-radius: 8px;
      box-sizing: border-box;
    }

    .tile-front {
      background: linear-gradient(to bottom, #1b263b, #0d1b2a);
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      color: #778da9;
    }

    .tile-back {
      background: linear-gradient(to bottom, #001233, #001845);
      transform: rotateX(180deg);
      border-color: var(--accent-gold);
      padding: 0 15px;
    }

    .tile.missed .tile-back {
      border-color: var(--strike-red);
      color: #999;
    }

    .answer-text {
      flex: 1;
      text-align: left;
      font-size: 19px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .answer-points {
      font-size: 26px;
      font-weight: bold;
      color: var(--accent-gold);
      border-left: 2px solid var(--accent-gold);
      padding-left: 15px;
      min-width: 40px;
    }

    /* PLAYER INPUT CONSOLE */
    .player-console {
      display: flex;
      gap: 15px;
      width: 100%;
      max-width: 600px;
    }

    .player-console input {
      flex: 1;
      padding: 15px;
      font-size: 18px;
      border: 2px solid var(--accent-gold);
      border-radius: 8px;
      background: #222;
      color: #fff;
      outline: none;
    }

    .player-console input:focus {
      box-shadow: 0 0 10px rgba(254, 209, 65, 0.5);
    }

    .player-console button {
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: var(--accent-gold);
      color: #000;
      transition: background 0.2s;
    }

    .player-console button:hover { background: #fff; }
    
    .next-btn {
      display: none;
      margin-top: 20px;
      padding: 15px 40px;
      font-size: 20px;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.15s, background 0.2s;
    }

    .next-btn:hover {
      background: #45a049;
      transform: scale(1.03);
    }

    .next-btn.show { display: block; }

    /* OVERLAYS (START, STRIKE, GAME OVER) */
    .start-screen, .game-over-screen {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(13, 27, 42, 0.96);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1200;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
      transition: opacity 0.4s;
    }

    .start-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .start-title {
      font-size: 56px;
      color: var(--accent-gold);
      margin: 0 0 10px 0;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 4px 20px rgba(254, 209, 65, 0.3);
    }

    .start-subtitle {
      font-size: 20px;
      color: #bbb;
      margin-bottom: 25px;
      max-width: 520px;
      line-height: 1.5;
    }

    /* TIMER SELECTOR ON START SCREEN */
    .timer-selector {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 35px;
      background: #1b263b;
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid #415a77;
    }

    .timer-selector-label {
      font-size: 16px;
      color: #ccc;
      font-weight: bold;
      margin-right: 5px;
    }

    .time-opt-btn {
      padding: 8px 16px;
      font-size: 15px;
      font-weight: bold;
      background: #0d1b2a;
      color: #aaa;
      border: 2px solid #415a77;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .time-opt-btn:hover {
      border-color: var(--accent-gold);
      color: #fff;
    }

    .time-opt-btn.selected {
      background: var(--accent-gold);
      color: #000;
      border-color: var(--accent-gold);
    }

    .begin-btn, .play-again-btn {
      padding: 18px 60px;
      font-size: 26px;
      background: var(--accent-gold);
      color: #000;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      letter-spacing: 2px;
      box-shadow: 0 8px 25px rgba(254, 209, 65, 0.3);
      transition: transform 0.2s, background 0.2s;
    }

    .begin-btn:hover, .play-again-btn:hover {
      background: #fff;
      transform: scale(1.06);
    }

    /* STRIKE OVERLAY */
    .strike-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1800;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .strike-overlay.show { opacity: 1; pointer-events: all; }

    .strike-mark {
      font-size: 280px;
      color: var(--strike-red);
      font-weight: bold;
      text-shadow: 0 0 40px #000;
      transform: scale(0.5);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .strike-overlay.show .strike-mark { transform: scale(1); }

    /* GAME OVER SCREEN */
    .game-over-screen {
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
    }

    .game-over-screen.show { opacity: 1; pointer-events: all; }

    .game-over-title {
      font-size: 60px;
      color: var(--accent-gold);
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .game-over-score {
      font-size: 45px;
      color: #fff;
      margin-bottom: 40px;
    }
  </style>
</head>

  <!-- Heads Up Display -->
  <div class="hud">
    <div class="hud-section">
      <div class="score-display">SCORE: <span id="scoreText">0</span></div>
      <div class="round-display" id="roundText">ROUND 1 / 50</div>
    </div>

    <div class="timer-display" id="timerDisplay">60</div>

    <div class="hud-section">
      <div class="audio-controls" title="Sound Controls">
        <button id="soundToggleBtn" class="sound-toggle-btn" onclick="toggleSound()" aria-label="Toggle Sound">🔊</button>
        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.05" value="0.5" oninput="updateVolume(this.value)">
      </div>

      <div class="strike-tracker" id="strikeTracker">
        <span id="strike-1">X</span>
        <span id="strike-2">X</span>
        <span id="strike-3">X</span>
      </div>
    </div>
  </div>

  <!-- Start Screen Overlay -->
  <div class="start-screen" id="startScreen">
    <h1 class="start-title">Family Feud</h1>
    <p class="start-subtitle">
      Solo Arcade Edition &bull; 50 Rounds<br>
      Clear the board before time runs out. 3 strikes and you're out!
    </p>
    <div class="timer-selector">
      <span class="timer-selector-label">Round Timer:</span>
      <button class="time-opt-btn" onclick="setRoundDuration(45, this)">45s</button>
      <button class="time-opt-btn selected" onclick="setRoundDuration(60, this)">60s</button>
      <button class="time-opt-btn" onclick="setRoundDuration(90, this)">90s</button>
    </div>
    <button class="begin-btn" onclick="startGame()">BEGIN</button>
  </div>

  <!-- Main Game Board -->
  <div class="game-container">
    <div class="question-display" id="questionText">Ready to Play...</div>
    
    <div class="board" id="board"></div>

    <div class="player-console" id="playerConsole">
      <input type="text" id="guessInput" placeholder="Type your guess..." onkeypress="handleEnter(event)" autocomplete="off">
      <button onclick="submitGuess()">GUESS</button>
    </div>

    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next Round &#9654;</button>
  </div>

  <!-- Strike / Time's Up Animation -->
  <div class="strike-overlay" id="strikeOverlay">
    <div class="strike-mark" id="strikeMark">X</div>
  </div>

  <!-- Custom Game Over Screen -->

    <div class="game-over-title">Game Over</div>
    <div class="game-over-score">Final Score: <span id="finalScoreText">0</span></div>

    // Game State
    let currentIndex = 0;
    let totalScore = 0;
    let currentStrikes = 0;
    let revealedTiles = 0;
    let currentAnswers = [];
    let roundActive = false;
    let isAnimatingStrike = false;
    
    // Timer State
    let roundTimer;
    let selectedRoundTime = 60;
    let timeLeft = selectedRoundTime;

    // Audio State (Web Audio API)
    let audioCtx = null;
    let isMuted = false;
    let masterVolume = 0.5;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleSound() {
      isMuted = !isMuted;
      const btn = document.getElementById('soundToggleBtn');
      if (isMuted) {
        btn.innerText = '🔇';
        btn.classList.add('muted');
      } else {
        btn.innerText = '🔊';
        btn.classList.remove('muted');
        initAudio();
      }
    }

    function updateVolume(val) {
      masterVolume = parseFloat(val);
      const btn = document.getElementById('soundToggleBtn');
      if (masterVolume === 0) {
        isMuted = true;
        btn.innerText = '🔇';
        btn.classList.add('muted');
      } else if (isMuted) {
        isMuted = false;
        btn.innerText = '🔊';
        btn.classList.remove('muted');
      }
    }

    function setRoundDuration(seconds, btnEl) {
      selectedRoundTime = seconds;
      timeLeft = seconds;
      document.getElementById('timerDisplay').innerText = seconds;
      document.querySelectorAll('.time-opt-btn').forEach(b => b.classList.remove('selected'));
      btnEl.classList.add('selected');
    }

    // 1. Correct Answer "Ding!"
    function playCorrectSound() {
      if (isMuted || masterVolume <= 0) return;
      initAudio();
      const now = audioCtx.currentTime;
      const freqs = [1046.50, 1318.51, 2093.00]; // C6, E6, C7 harmonic bell
      freqs.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = idx === 0 ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(freq, now);

        const vol = (idx === 0 ? 0.35 : 0.18) * masterVolume;
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(vol, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.7);
      });
    }

    // Helper: Studio Game Show Buzzer Voice (Filtered PA Horn + Mechanical Rattle)
    function triggerStudioBuzzer(startTime, duration, baseFreq = 73.42) {
      // Master envelope for this blast
      const envGain = audioCtx.createGain();
      envGain.gain.setValueAtTime(0.001, startTime);
      envGain.gain.linearRampToValueAtTime(0.55 * masterVolume, startTime + 0.018);
      envGain.gain.setValueAtTime(0.52 * masterVolume, startTime + duration - 0.06);
      envGain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

      // Subtle mechanical buzzer rattle (32 Hz amplitude modulation)
      const rattleGain = audioCtx.createGain();
      rattleGain.gain.setValueAtTime(0.85, startTime);
      const lfo = audioCtx.createOscillator();
      const lfoDepth = audioCtx.createGain();
      lfo.type = 'sine';
      lfo.frequency.setValueAtTime(32, startTime);
      lfoDepth.gain.setValueAtTime(0.18, startTime);
      lfo.connect(lfoDepth);
      lfoDepth.connect(rattleGain.gain);

      // Studio PA Horn EQ: warm low-pass + nasal midrange resonance
      const lowpass = audioCtx.createBiquadFilter();
      lowpass.type = 'lowpass';
      lowpass.frequency.setValueAtTime(950, startTime);
      lowpass.Q.setValueAtTime(1.2, startTime);

      const nasalPeak = audioCtx.createBiquadFilter();
      nasalPeak.type = 'peaking';
      nasalPeak.frequency.setValueAtTime(380, startTime);
      nasalPeak.Q.setValueAtTime(2.2, startTime);
      nasalPeak.gain.setValueAtTime(7, startTime);

      // Chain: oscillators -> nasalPeak -> lowpass -> rattleGain -> envGain -> destination
      nasalPeak.connect(lowpass);
      lowpass.connect(rattleGain);
      rattleGain.connect(envGain);
      envGain.connect(audioCtx.destination);

      // Layered brassy/buzzer harmonics (slight dissonance gives the authentic TV "ENH!")
      const partials = [
        { mult: 1.0,  type: 'sawtooth', gain: 0.45 },
        { mult: 2.0,  type: 'sawtooth', gain: 0.35 },
        { mult: 2.06, type: 'triangle', gain: 0.30 },
        { mult: 3.0,  type: 'sawtooth', gain: 0.22 },
        { mult: 4.12, type: 'triangle', gain: 0.15 }
      ];

      partials.forEach(p => {
        const osc = audioCtx.createOscillator();
        const pGain = audioCtx.createGain();
        osc.type = p.type;
        osc.frequency.setValueAtTime(baseFreq * p.mult, startTime);
        pGain.gain.setValueAtTime(p.gain, startTime);
        osc.connect(pGain);
        pGain.connect(nasalPeak);
        osc.start(startTime);
        osc.stop(startTime + duration + 0.02);
      });

      lfo.start(startTime);
      lfo.stop(startTime + duration + 0.02);
    }

    // 2. Wrong Answer Strike ("ENH!")
    function playWrongSound() {
      if (isMuted || masterVolume <= 0) return;
      initAudio();
      const now = audioCtx.currentTime;
      triggerStudioBuzzer(now, 0.58, 73.42);
    }

    // 3. Time's Up Double Buzzer ("ENH! ENHHHH!")
    function playTimeUpSound() {
      if (isMuted || masterVolume <= 0) return;
      initAudio();
      const now = audioCtx.currentTime;
      triggerStudioBuzzer(now, 0.25, 65.41);
      triggerStudioBuzzer(now + 0.30, 0.72, 65.41);
    }

    // 4. Subtle Countdown Tick (last 5 seconds)
    function playTickSound() {
      if (isMuted || masterVolume <= 0) return;
      initAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, now);

      gain.gain.setValueAtTime(0.12 * masterVolume, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.07);
    }

    // Start Game from BEGIN Button
    function startGame() {
      initAudio();
      document.getElementById('startScreen').classList.add('hidden');
      loadQuestion(currentIndex);
    }

    function loadQuestion(index) {
      const qData = questionBank[index];
      document.getElementById('questionText').innerText = qData.question;
      document.getElementById('roundText').innerText = `ROUND ${index + 1} / ${questionBank.length}`;
      
      // Reset Round State
      currentStrikes = 0;
      revealedTiles = 0;
      roundActive = true;
      isAnimatingStrike = false;
      updateStrikeUI();
      
      document.getElementById('nextBtn').classList.remove('show');
      document.getElementById('playerConsole').style.display = 'flex';
      
      const input = document.getElementById('guessInput');
      input.value = '';
      input.focus();

      const board = document.getElementById('board');
      board.innerHTML = ''; 

      currentAnswers = [...qData.answers].sort((a, b) => b.points - a.points);
      
      currentAnswers.forEach((ans, i) => {
        ans.revealed = false;
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.id = `tile-${i}`;
        tile.innerHTML = `
          <div class="tile-inner">
            <div class="tile-front">${i + 1}</div>
            <div class="tile-back">
              <span class="answer-text">${ans.text}</span>
              <span class="answer-points">${ans.points}</span>
            </div>
          </div>
        `;
        board.appendChild(tile);
      });

      startTimer();
    }

    function startTimer() {
      clearInterval(roundTimer);
      timeLeft = selectedRoundTime;
      updateTimerUI();
      
      roundTimer = setInterval(() => {
        if (!roundActive) {
          clearInterval(roundTimer);
          return;
        }
        // Pause clock briefly while strike X is flashing
        if (isAnimatingStrike) return;
        
        timeLeft--;
        updateTimerUI();

        if (timeLeft <= 5 && timeLeft > 0) {
          playTickSound();
        }
        
        if (timeLeft <= 0) {
          clearInterval(roundTimer);
          triggerTimeOut();
        }
      }, 1000);
    }

    function updateTimerUI() {
      const timerDisplay = document.getElementById('timerDisplay');
      timerDisplay.innerText = timeLeft;
      
      if (timeLeft <= 10 && timeLeft > 0) {
        timerDisplay.classList.add('low');
      } else {
        timerDisplay.classList.remove('low');
      }
    }

    function triggerTimeOut() {
      if (!roundActive) return;
      roundActive = false;
      playTimeUpSound();
      
      const overlay = document.getElementById('strikeOverlay');
      const strikeMark = document.getElementById('strikeMark');
      strikeMark.innerText = 'TIME!';
      strikeMark.style.fontSize = '180px';
      overlay.classList.add('show');
      
      setTimeout(() => {
        overlay.classList.remove('show');
        endRound(false);
      }, 1600);
    }

    function handleEnter(e) {
      if (e.key === 'Enter') submitGuess();
    }

    function submitGuess() {
      if (!roundActive || isAnimatingStrike) return;

      const inputField = document.getElementById('guessInput');
      const guess = inputField.value.trim().toLowerCase();
      
      if (guess.length < 2) return;

      let matchFound = false;

      for (let i = 0; i < currentAnswers.length; i++) {
        let ans = currentAnswers[i];
        
        if (!ans.revealed) {
          let textMatch = ans.text.toLowerCase().includes(guess);
          
          let keywordMatch = false;
          if (ans.keywords && Array.isArray(ans.keywords)) {
            keywordMatch = ans.keywords.some(keyword => {
              const kw = keyword.toLowerCase();
              return guess.includes(kw) || kw.includes(guess);
            });
          }

          if (textMatch || keywordMatch) {
            revealTile(i, ans.points);
            matchFound = true;
            break;
          }
        }
      }

      if (matchFound) {
        playCorrectSound();
        inputField.value = '';
        checkRoundWin();
      } else {
        triggerStrike();
      }
    }

    function revealTile(index, points) {
      const tile = document.getElementById(`tile-${index}`);
      if (tile && !currentAnswers[index].revealed) {
        tile.classList.add('flipped');
        currentAnswers[index].revealed = true;
        revealedTiles++;
        
        if (points > 0) {
          totalScore += points;
          document.getElementById('scoreText').innerText = totalScore;
        }
      }
    }

    function triggerStrike() {
      isAnimatingStrike = true;
      currentStrikes++;
      updateStrikeUI();
      playWrongSound();

      const overlay = document.getElementById('strikeOverlay');
      const strikeMark = document.getElementById('strikeMark');
      strikeMark.innerText = 'X'.repeat(currentStrikes);
      strikeMark.style.fontSize = '280px';
      
      overlay.classList.add('show');
      
      setTimeout(() => {
        overlay.classList.remove('show');
        isAnimatingStrike = false;
        if (currentStrikes >= 3) {
          endRound(false);
        } else {
          document.getElementById('guessInput').value = '';
          document.getElementById('guessInput').focus();
        }
      }, 1300);
    }

    function updateStrikeUI() {
      for (let i = 1; i <= 3; i++) {
        const x = document.getElementById(`strike-${i}`);
        if (i <= currentStrikes) {
          x.classList.add('active');
        } else {
          x.classList.remove('active');
        }
      }
    }

    function checkRoundWin() {
      if (revealedTiles === currentAnswers.length) {
        endRound(true);
      }
    }

    function endRound(perfect) {
      roundActive = false;
      clearInterval(roundTimer);
      document.getElementById('playerConsole').style.display = 'none';
      document.getElementById('nextBtn').classList.add('show');

      // Flip remaining missed tiles
      if (!perfect) {
        let delayStep = 0;
        currentAnswers.forEach((ans, i) => {
          if (!ans.revealed) {
            const tile = document.getElementById(`tile-${i}`);
            tile.classList.add('missed');
            setTimeout(() => { tile.classList.add('flipped'); }, delayStep * 300);
            delayStep++;
          }
        });
      }
    }

    function nextQuestion() {
      if (currentIndex < questionBank.length - 1) {
        currentIndex++;
        loadQuestion(currentIndex);
      } else {
        showGameOver();
      }
    }

    function showGameOver() {
      document.getElementById('finalScoreText').innerText = totalScore;
      document.getElementById('gameOverScreen').classList.add('show');
    }

    function restartGame() {
      currentIndex = 0;
      totalScore = 0;
      document.getElementById('scoreText').innerText = '0';
      document.getElementById('gameOverScreen').classList.remove('show');
      loadQuestion(currentIndex);
    }

    // Set initial round counter display without starting timer
    window.onload = () => {
      document.getElementById('roundText').innerText = `ROUND 1 / ${questionBank.length}`;
      document.getElementById('timerDisplay').innerText = selectedRoundTime;
    };
  </script>

</body>
</html>
