<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Feud - Solo Arcade Pro</title>
  <style>
    :root {
      --bg-color: #0d1b2a;
      --board-bg: #1b263b;
      --accent-gold: #FED141;
      --text-light: #e0e1dd;
      --strike-red: #d90429;
    }

    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* SCORE, TIMER & STRIKE HUD */
    .hud {
      width: 100%;
      background: #000;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
      border-bottom: 2px solid var(--accent-gold);
    }
    
    .hud-section {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .score-display {
      font-size: 24px;
      font-weight: bold;
      color: var(--accent-gold);
    }

    .timer-display {
      font-size: 28px;
      font-weight: bold;
      color: #fff;
      background: #222;
      padding: 5px 15px;
      border-radius: 6px;
      border: 2px solid #555;
      min-width: 50px;
      text-align: center;
      transition: all 0.3s;
    }

    .timer-display.low {
      color: var(--strike-red);
      border-color: var(--strike-red);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(217, 4, 41, 0.7); }
      50% { transform: scale(1.05); box-shadow: 0 0 10px 5px rgba(217, 4, 41, 0) }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(217, 4, 41, 0); }
    }

    .strike-tracker {
      display: flex;
      gap: 10px;
      font-size: 30px;
      color: #333; 
    }
    .strike-tracker span.active {
      color: var(--strike-red);
      text-shadow: 0 0 10px var(--strike-red);
    }

    /* GAME BOARD */
    .game-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1000px;
      padding: 20px;
    }

    .question-display {
      font-size: 26px;
      text-align: center;
      margin-bottom: 25px;
      padding: 20px;
      background: var(--board-bg);
      border: 4px solid var(--accent-gold);
      border-radius: 12px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      width: 90%;
    }

    .board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      width: 100%;
      margin-bottom: 30px;
    }

    /* TILES */
    .tile {
      background-color: transparent;
      height: 70px;
      perspective: 1000px;
    }
    .tile-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    .tile.flipped .tile-inner { transform: rotateX(180deg); }
    
    .tile-front, .tile-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      border: 3px solid #415a77;
      border-radius: 8px;
      box-sizing: border-box;
    }
    .tile-front {
      background: linear-gradient(to bottom, #1b263b, #0d1b2a);
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      color: #778da9;
    }
    .tile-back {
      background: linear-gradient(to bottom, #001233, #001845);
      transform: rotateX(180deg);
      border-color: var(--accent-gold);
      padding: 0 15px;
    }
    .tile.missed .tile-back {
      border-color: var(--strike-red);
      color: #999;
    }

    .answer-text {
      flex: 1;
      text-align: left;
      font-size: 20px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .answer-points {
      font-size: 26px;
      font-weight: bold;
      color: var(--accent-gold);
      border-left: 2px solid var(--accent-gold);
      padding-left: 15px;
    }

    /* PLAYER INPUT CONSOLE */
    .player-console {
      display: flex;
      gap: 15px;
      width: 100%;
      max-width: 600px;
    }
    .player-console input {
      flex: 1;
      padding: 15px;
      font-size: 18px;
      border: 2px solid var(--accent-gold);
      border-radius: 8px;
      background: #222;
      color: #fff;
      outline: none;
    }
    .player-console input:focus {
      box-shadow: 0 0 10px rgba(254, 209, 65, 0.5);
    }
    .player-console button {
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: var(--accent-gold);
      color: #000;
      transition: background 0.2s;
    }
    .player-console button:hover { background: #fff; }
    
    .next-btn {
      display: none;
      margin-top: 20px;
      padding: 15px 40px;
      font-size: 20px;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .next-btn.show { display: block; }

    /* STRIKE OVERLAY */
    .strike-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .strike-overlay.show { opacity: 1; pointer-events: all; }
    .strike-mark {
      font-size: 400px;
      color: var(--strike-red);
      font-weight: bold;
      text-shadow: 0 0 40px #000;
      transform: scale(0.5);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .strike-overlay.show .strike-mark { transform: scale(1); }

    /* GAME OVER SCREEN */
    .game-over-screen {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s;
    }
    .game-over-screen.show { opacity: 1; pointer-events: all; }
    .game-over-title {
      font-size: 60px;
      color: var(--accent-gold);
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 3px;
    }
    .game-over-score {
      font-size: 45px;
      color: #fff;
      margin-bottom: 40px;
    }
    .play-again-btn {
      padding: 15px 50px;
      font-size: 24px;
      background: var(--accent-gold);
      color: #000;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s, background 0.2s;
    }
    .play-again-btn:hover {
      background: #fff;
      transform: scale(1.05);
    }

  </style>
</head>
<body>

  <!-- Heads Up Display -->
  <div class="hud">
    <div class="hud-section">
      <div class="score-display">SCORE: <span id="scoreText">0</span></div>
    </div>
    <div class="timer-display" id="timerDisplay">30</div>
    <div class="hud-section">
      <div class="strike-tracker" id="strikeTracker">
        <span id="strike-1">X</span>
        <span id="strike-2">X</span>
        <span id="strike-3">X</span>
      </div>
    </div>
  </div>

  <!-- Main Game Board -->
  <div class="game-container">
    <div class="question-display" id="questionText">Loading Question...</div>
    
    <div class="board" id="board"></div>

    <div class="player-console" id="playerConsole">
      <input type="text" id="guessInput" placeholder="Type your guess..." onkeypress="handleEnter(event)" autocomplete="off">
      <button onclick="submitGuess()">GUESS</button>
    </div>

    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next Round &#9654;</button>
  </div>

  <!-- Strike Animation -->
  <div class="strike-overlay" id="strikeOverlay">
    <div class="strike-mark">X</div>
  </div>

  <!-- Custom Game Over Screen -->
  <div class="game-over-screen" id="gameOverScreen">
    <div class="game-over-title">Game Over</div>
    <div class="game-over-score">Final Score: <span id="finalScoreText">0</span></div>
    <button class="play-again-btn" onclick="restartGame()">Play Again</button>
  </div>

  <script>
    // First two questions have the new 'keywords' property added for testing smart matching
    const questionBank = [
      {
        "question": "Name a reason someone might secretly check their partner's phone.",
        "answers": [
          {"text": "Suspect cheating", "points": 45, "keywords": ["cheat", "affair", "infidelity", "unfaithful", "other woman", "other man"]},
          {"text": "Curiosity/Snooping", "points": 20, "keywords": ["nosy", "nosey", "curious", "snoop", "spy", "spying"]},
          {"text": "Looking for a password", "points": 15, "keywords": ["passcode", "login", "pin"]},
          {"text": "Checking messages from an ex", "points": 10, "keywords": ["ex boyfriend", "ex girlfriend", "past lover"]},
          {"text": "To find a surprise gift", "points": 5, "keywords": ["present", "birthday", "christmas", "snooping for gifts"]},
          {"text": "Checking bank/money apps", "points": 5, "keywords": ["finances", "cash app", "venmo", "bank account", "spending"]}
        ]
      },
      {
        "question": "Name something you might do if you wake up with a massive hangover.",
        "answers": [
          {"text": "Drink water/Gatorade", "points": 35, "keywords": ["hydrate", "fluids", "drink powerade", "liquid"]},
          {"text": "Take pain meds", "points": 25, "keywords": ["advil", "tylenol", "aspirin", "ibuprofen", "pills"]},
          {"text": "Go back to sleep", "points": 20, "keywords": ["nap", "stay in bed", "rest"]},
          {"text": "Eat greasy food", "points": 10, "keywords": ["fast food", "burger", "pizza", "mcdonalds"]},
          {"text": "Call out sick", "points": 6, "keywords": ["call in sick", "miss work", "skip work", "stay home"]},
          {"text": "Swear off drinking", "points": 4, "keywords": ["never drink again", "quit alcohol", "stop drinking"]}
        ]
      },
      // You can generate the rest with keywords via Google AI Studio and paste them here
      {
        "question": "Name a place you definitely don't want your boss to catch you.",
        "answers": [
          {"text": "At a bar/club", "points": 35},
          {"text": "In bed/Sleeping", "points": 25},
          {"text": "Interviewing for another job", "points": 15},
          {"text": "The bathroom", "points": 12},
          {"text": "A strip club", "points": 8},
          {"text": "Stealing office supplies", "points": 5}
        ]
      }
    ];

    let currentIndex = 0;
    let totalScore = 0;
    let currentStrikes = 0;
    let revealedTiles = 0;
    let currentAnswers = [];
    let roundActive = true;
    
    // Timer Variables
    let roundTimer;
    let timeLeft = 30;

    function loadQuestion(index) {
      const qData = questionBank[index];
      document.getElementById('questionText').innerText = qData.question;
      
      // Reset Round State
      currentStrikes = 0;
      revealedTiles = 0;
      roundActive = true;
      updateStrikeUI();
      
      document.getElementById('nextBtn').classList.remove('show');
      document.getElementById('playerConsole').style.display = 'flex';
      
      const input = document.getElementById('guessInput');
      input.value = '';
      input.focus();

      const board = document.getElementById('board');
      board.innerHTML = ''; 

      currentAnswers = [...qData.answers].sort((a, b) => b.points - a.points);
      
      currentAnswers.forEach((ans, i) => {
        ans.revealed = false;
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.id = `tile-${i}`;
        tile.innerHTML = `
          <div class="tile-inner">
            <div class="tile-front">${i + 1}</div>
            <div class="tile-back">
              <span class="answer-text">${ans.text}</span>
              <span class="answer-points">${ans.points}</span>
            </div>
          </div>
        `;
        board.appendChild(tile);
      });

      startTimer();
    }

    function startTimer() {
      clearInterval(roundTimer);
      timeLeft = 30;
      updateTimerUI();
      
      roundTimer = setInterval(() => {
        if (!roundActive) {
          clearInterval(roundTimer);
          return;
        }
        
        timeLeft--;
        updateTimerUI();
        
        if (timeLeft <= 0) {
          clearInterval(roundTimer);
          triggerTimeOut();
        }
      }, 1000);
    }

    function updateTimerUI() {
      const timerDisplay = document.getElementById('timerDisplay');
      timerDisplay.innerText = timeLeft;
      
      if (timeLeft <= 10 && timeLeft > 0) {
        timerDisplay.classList.add('low');
      } else {
        timerDisplay.classList.remove('low');
      }
    }

    function triggerTimeOut() {
      if (!roundActive) return;
      
      // Show big X for running out of time
      const overlay = document.getElementById('strikeOverlay');
      const strikeMark = document.querySelector('.strike-mark');
      strikeMark.innerText = 'TIME!';
      overlay.classList.add('show');
      
      setTimeout(() => {
        overlay.classList.remove('show');
        endRound(false); // End round automatically when time is up
      }, 1500);
    }

    function handleEnter(e) {
      if(e.key === 'Enter') submitGuess();
    }

    function submitGuess() {
      if (!roundActive) return;

      const inputField = document.getElementById('guessInput');
      const guess = inputField.value.trim().toLowerCase();
      
      if (guess.length < 2) return;

      let matchFound = false;

      for (let i = 0; i < currentAnswers.length; i++) {
        let ans = currentAnswers[i];
        
        if (!ans.revealed) {
          // Check main text match
          let textMatch = ans.text.toLowerCase().includes(guess);
          
          // Check keyword match
          let keywordMatch = false;
          if (ans.keywords && Array.isArray(ans.keywords)) {
            keywordMatch = ans.keywords.some(keyword => {
              const kw = keyword.toLowerCase();
              return guess.includes(kw) || kw.includes(guess);
            });
          }

          if (textMatch || keywordMatch) {
            revealTile(i, ans.points);
            matchFound = true;
            break;
          }
        }
      }

      if (matchFound) {
        inputField.value = '';
        checkRoundWin();
      } else {
        triggerStrike();
      }
    }

    function revealTile(index, points) {
      const tile = document.getElementById(`tile-${index}`);
      if (tile && !currentAnswers[index].revealed) {
        tile.classList.add('flipped');
        currentAnswers[index].revealed = true;
        revealedTiles++;
        
        if (points > 0) {
          totalScore += points;
          document.getElementById('scoreText').innerText = totalScore;
        }
      }
    }

    function triggerStrike() {
      currentStrikes++;
      updateStrikeUI();

      const overlay = document.getElementById('strikeOverlay');
      const strikeMark = document.querySelector('.strike-mark');
      strikeMark.innerText = 'X'.repeat(currentStrikes);
      
      overlay.classList.add('show');
      
      setTimeout(() => {
        overlay.classList.remove('show');
        if (currentStrikes >= 3) {
          endRound(false);
        } else {
          document.getElementById('guessInput').value = '';
          document.getElementById('guessInput').focus();
        }
      }, 1500);
    }

    function updateStrikeUI() {
      for(let i = 1; i <= 3; i++) {
        const x = document.getElementById(`strike-${i}`);
        if(i <= currentStrikes) {
          x.classList.add('active');
        } else {
          x.classList.remove('active');
        }
      }
    }

    function checkRoundWin() {
      if (revealedTiles === currentAnswers.length) {
        endRound(true);
      }
    }

    function endRound(perfect) {
      roundActive = false;
      clearInterval(roundTimer);
      document.getElementById('playerConsole').style.display = 'none';
      document.getElementById('nextBtn').classList.add('show');

      // Flip remaining missed tiles
      if (!perfect) {
        currentAnswers.forEach((ans, i) => {
          if (!ans.revealed) {
            const tile = document.getElementById(`tile-${i}`);
            tile.classList.add('missed');
            setTimeout(() => { tile.classList.add('flipped'); }, i * 300);
          }
        });
      }
    }

    function nextQuestion() {
      if (currentIndex < questionBank.length - 1) {
        currentIndex++;
        loadQuestion(currentIndex);
      } else {
        showGameOver();
      }
    }

    function showGameOver() {
      document.getElementById('finalScoreText').innerText = totalScore;
      document.getElementById('gameOverScreen').classList.add('show');
    }

    function restartGame() {
      currentIndex = 0;
      totalScore = 0;
      document.getElementById('scoreText').innerText = '0';
      document.getElementById('gameOverScreen').classList.remove('show');
      loadQuestion(currentIndex);
    }

    // Load initial data
    window.onload = () => loadQuestion(currentIndex);
  </script>

</body>
</html>
